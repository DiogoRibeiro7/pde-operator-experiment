name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.15.11"
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: The tests left the working tree untouched
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then echo "$changes"; exit 1; fi

  smoke:
    name: Quick run of the whole pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Main run (quick configuration, writes results-quick/)
        run: python run_experiment.py --quick
      - name: Downstream scripts on the quick results
        run: |
          python check_reference.py --results results-quick
          python baselines.py --results results-quick
          python ablation_log_input.py --results results-quick
          python fno_padding_check.py --results results-quick
          python timing.py --results results-quick
          python make_figures.py --results results-quick
      - name: Nothing outside results-quick/ was written or changed
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then echo "$changes"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-quick
          path: results-quick
          retention-days: 7
          if-no-files-found: ignore
