name: Release

# Run from the Actions tab, on main, with the new version number. The workflow
# sets the version in pyproject.toml and CITATION.cff, runs the checks and the
# docs build, commits the bump if there is one, tags it, publishes a GitHub
# release with the results and figures attached, and rebuilds the docs site.
# With the Zenodo GitHub integration enabled, each release gets a DOI.
#
# It can be rerun safely: if the tag already exists but the release does not
# (a previous run failed after tagging), it resumes from the tag and only
# creates the release. If a branch ruleset protects main, add GitHub Actions to
# its bypass list, or the version commit will be rejected.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: write          # to start the Docs workflow after the version bump

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the version, or resume an interrupted release
        id: plan
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::error::v$VERSION is already released"; exit 1
            fi
            echo "::notice::tag v$VERSION exists without a release: resuming from the tag"
            git checkout -q "v$VERSION"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          lowest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | head -n 1)"
          if [ "$lowest" != "$current" ]; then
            echo "::error::$VERSION is lower than the version in pyproject.toml ($current)"; exit 1
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$latest" ]; then
            highest="$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -n 1)"
            if [ "$highest" != "$VERSION" ]; then
              echo "::error::$VERSION is not higher than the latest release $latest"; exit 1
            fi
          fi
          echo "resume=false" >> "$GITHUB_OUTPUT"

      - name: Set the version and release date
        if: steps.plan.outputs.resume == 'false'
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^version: .*/version: \"$VERSION\"/" CITATION.cff
          sed -i -E "s/^date-released: .*/date-released: \"$(date -u +%F)\"/" CITATION.cff
          grep -qx "version = \"$VERSION\"" pyproject.toml || { echo "::error::pyproject.toml was not updated"; exit 1; }
          grep -qx "version: \"$VERSION\"" CITATION.cff || { echo "::error::CITATION.cff was not updated"; exit 1; }
          git diff --stat

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev,docs]"
          ruff check .
          pytest
          mkdocs build --strict
          rm -rf site

      - name: Commit, tag and push
        if: steps.plan.outputs.resume == 'false'
        run: |
          git config user.name "Diogo Ribeiro"
          git config user.email "diogo_dj@hotmail.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Package results and figures
        run: zip -r "pde-operator-experiment-v$VERSION-results.zip" results figures

      - name: Create the GitHub release
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "pde-operator-experiment-v$VERSION-results.zip"

      - name: Rebuild the docs site with the new version
        # Pushes made with GITHUB_TOKEN do not start other workflows; a dispatch does.
        run: gh workflow run docs.yml --ref main
