name: Reproduce results

# Runs the pipeline from scratch on a GitHub runner and uploads the results
# and figures as an artifact. Nothing is committed: compare the artifact with
# results/ and figures/, and open a pull request if they should be replaced.
# Timings depend on the machine. Accuracy numbers are reproducible bit for bit
# only on the same CPU model and software versions; on a runner, the
# network-based ones can differ slightly in the last digits.

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Tiny configuration (a few minutes) instead of the full run"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RESULTS: ${{ inputs.quick && 'results-quick' || 'results' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
      - name: Install (every package pinned; the scripts run from the repository root)
        run: pip install -r requirements.txt -c requirements-lock.txt
      - name: Main run
        run: python run_experiment.py ${{ inputs.quick && '--quick' || '' }}
      - name: Downstream scripts
        run: |
          python check_reference.py --results "$RESULTS"
          python baselines.py --results "$RESULTS"
          python ablation_log_input.py --results "$RESULTS"
          python fno_padding_check.py --results "$RESULTS"
          python timing.py --results "$RESULTS"
          python make_figures.py --results "$RESULTS"
      - name: Compare with the committed results
        if: ${{ !inputs.quick }}
        run: |
          python - <<'EOF'
          import json, subprocess
          def pair(name):
              old = json.loads(subprocess.check_output(["git", "show", f"HEAD:results/{name}"]))
              return old, json.load(open(f"results/{name}"))
          for name, keys in (("baselines.json", ("model_mean_error_train", "matching_n")),
                             ("derived.json", ("fd_convergence_slope_by_family",))):
              old, new = pair(name)
              for k in keys:
                  print(f"{name}:{k}\n  committed: {old.get(k)}\n  this run:  {new.get(k)}")
          EOF
      - name: Upload the quick results
        if: ${{ always() && inputs.quick }}
        uses: actions/upload-artifact@v7
        with:
          name: reproduced-quick-${{ github.sha }}
          path: results-quick
          if-no-files-found: ignore
      - name: Upload the full results
        if: ${{ always() && !inputs.quick }}
        uses: actions/upload-artifact@v7
        with:
          name: reproduced-full-${{ github.sha }}
          path: |
            results
            figures
          if-no-files-found: ignore
