name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:     # also started by the Release workflow after it bumps the version

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the docs dependencies declared in pyproject.toml
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))" > "$RUNNER_TEMP/docs-requirements.txt"
          pip install -r "$RUNNER_TEMP/docs-requirements.txt"
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Pages must be enabled once in Settings -> Pages -> Source: GitHub Actions.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deployment at a time; pull-request builds above are never queued behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
